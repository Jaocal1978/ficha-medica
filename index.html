<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ficha Médica</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-light">

    <div class="container mt-5">
        <!-- Botón que aparece cuando se cierra el formulario -->
        <div id="nuevoRegistroDiv" class="mt-3" style="display:none;">
            <button type="button" class="btn btn-primary" onclick="abrirFormulario()">
                <i class="fa-solid fa-plus"></i> Nuevo registro
            </button>
        </div>

        <div id="formularioCard" class="card shadow">
            <div class="card-header bg-primary text-white">
                <i class="fa-solid fa-notes-medical"></i> Ficha Médica
            </div>
            <div class="card-body">
                <form id="fichaMedica" name="fichaMedica">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label"><i class="fa-solid fa-id-card"></i> RUT</label>
                            <input type="text" class="form-control" id="rut" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label"><i class="fa-solid fa-user"></i> Nombres</label>
                            <input type="text" class="form-control" id="nombres" required>
                        </div>
                    </div>
                
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label"><i class="fa-solid fa-user"></i> Apellidos</label>
                            <input type="text" class="form-control" id="apellidos" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label"><i class="fa-solid fa-home"></i> Dirección</label>
                            <input type="text" class="form-control" id="direccion">
                        </div>
                    </div>
                
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label"><i class="fa-solid fa-city"></i> Ciudad</label>
                            <input type="text" class="form-control" id="ciudad">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label"><i class="fa-solid fa-phone"></i> Teléfono</label>
                            <input type="tel" class="form-control" id="telefono">
                        </div>
                    </div>
                
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label"><i class="fa-solid fa-envelope"></i> Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label"><i class="fa-solid fa-calendar"></i> Fecha de Nacimiento</label>
                            <input type="date" class="form-control" id="fechaNacimiento">
                        </div>
                    </div>
                
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label"><i class="fa-solid fa-heart"></i> Estado Civil</label>
                            <select class="form-select" id="estadoCivil">
                                <option>Soltero</option>
                                <option>Casado</option>
                                <option>Divorciado</option>
                                <option>Viudo</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label"><i class="fa-solid fa-comment"></i> Comentarios</label>
                            <textarea class="form-control" id="comentarios" placeholder="Escribe tus comentarios aquí, hasta 200 caracteres."></textarea>
                        </div>
                    </div>
                
                    <!-- Botones -->
                    <button type="button" class="btn btn-success" onclick="guardar()">
                        <i class="fa-solid fa-save"></i> Guardar
                    </button>
                    <button type="button" class="btn btn-warning" onclick="limpiarFormulario()">
                        <i class="fa-solid fa-broom"></i> Limpiar
                    </button>
                    <button type="button" class="btn btn-danger" onclick="cerrar()">
                        <i class="fa-solid fa-xmark"></i> Cerrar
                    </button>
                </form>
            </div>
        </div>
        <!-- Tabla de registros -->
        <div class="card mt-4 shadow">
            <div class="card-header bg-secondary text-white">
                <i class="fa-solid fa-table"></i> Registros ingresados
            </div>
            <div class="card-body">
                <div class="input-group mb-3">
                    <input type="text" id="buscarApellido" class="form-control" placeholder="Buscar por apellido...">
                    <button class="btn btn-info" onclick="buscarPorApellido()">
                        <i class="fa-solid fa-search"></i> Buscar
                    </button>
                </div>
                <table class="table table-striped" id="tablaRegistros">
                    <thead>
                        <tr>
                            <th>RUT</th>
                            <th>Nombres</th>
                            <th>Apellidos</th>
                            <th>Email</th>
                            <th>Teléfono</th>
                            <th>Ciudad</th>
                            <th>Estado Civil</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        </div>
    </div>
</body>

<script src="index.js"></script>

</html>
